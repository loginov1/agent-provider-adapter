# Managed by agent-jobs (agent-provider-adapter). Provider: Claude Code.
# Presence of this file selects Claude for review; remove it with
#   agent-jobs provider review codex
# to return to the unit's original Codex configuration. Schedules, locks,
# budgets, retries and the outer sandbox are unchanged.
# No ReadWritePaths line: the example review unit does not set
# ProtectHome=read-only. If yours does, add the Claude config directory as
# backlog.70-agent-provider.conf does.
[Service]
Environment=CODEX_BIN=/usr/local/libexec/agent-provider/jobs/review/agent-exec
Environment=REVIEW_MODEL=claude-opus-5-5
