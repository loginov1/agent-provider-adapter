# Managed by agent-jobs (agent-provider-adapter). Provider: Claude Code.
# Presence of this file selects Claude for backlog; remove it with
#   agent-jobs provider backlog codex
# to return to the unit's original Codex configuration. Schedules, locks,
# budgets, retries and the outer sandbox are unchanged.
[Service]
Environment=CODEX_BIN=/usr/local/libexec/agent-provider/jobs/backlog/agent-exec
Environment=BACKLOG_MODEL=claude-opus-5-5
ReadWritePaths=/srv/agent/.local/state/agent-provider/claude-config
